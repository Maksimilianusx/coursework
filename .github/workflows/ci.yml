name: Validate build and deploy lab
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy this revision to the prepared lab Swarm
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: python scripts/verify_static.py && python -m unittest discover -s tests -p test_core.py -v
      - name: Validate JavaScript
        run: node --check edge/html/app.js
      - name: Prepare disposable CI secrets for Compose validation
        run: python scripts/generate_secrets.py
      - run: docker compose config --quiet
      - run: REGISTRY=example.invalid/course IMAGE_TAG=validation docker stack config -c stack.yml >/dev/null
      - name: Build Compose images and import application
        run: docker compose build && docker run --rm course/api:local python -c 'import app'
      - name: Run HTTP and JWT component tests
        run: docker run --rm -v "$PWD/tests:/tests:ro" course/api:local python -m unittest discover -s /tests -v
      - name: Start real integration environment
        run: |
          echo '127.0.0.1 iam.lab.test' | sudo tee -a /etc/hosts
          docker compose up -d --no-build
          docker compose --profile tools run --rm bootstrap
          for attempt in $(seq 1 60); do
            if curl --fail --silent --cacert secrets/tls.crt https://iam.lab.test/health/ready; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Verify real OIDC CRUD RBAC and audit
        run: python scripts/acceptance_http.py --secrets-dir secrets --output evidence/http-acceptance.json
      - name: Check readiness after internal service restart
        run: |
          docker compose stop api keycloak
          docker compose start keycloak api
          for attempt in $(seq 1 60); do
            if curl --fail --silent --cacert secrets/tls.crt https://iam.lab.test/health/ready; then exit 0; fi
            sleep 2
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-evidence
          path: evidence/http-acceptance.json
          if-no-files-found: ignore
      - name: Save the exact images that passed integration tests
        run: docker save course/api:local course/edge:local course/keycloak:local course/app-db:local course/identity-db:local | gzip > tested-images.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: tested-images
          path: tested-images.tar.gz
          retention-days: 1
          compression-level: 0
      - name: Stop disposable integration environment
        if: always()
        run: docker compose down --volumes
  build:
    if: github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          name: tested-images
      - run: gunzip -c tested-images.tar.gz | docker load
      - name: Publish the tested images with revision tags
        run: |
          owner=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          registry="ghcr.io/$owner/course"
          for component in api edge keycloak app-db identity-db; do
            docker tag "course/$component:local" "$registry/$component:$GITHUB_SHA"
            docker push "$registry/$component:$GITHUB_SHA"
          done
  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy && github.ref == 'refs/heads/main'
    needs: build
    runs-on: [self-hosted, linux, course-lab]
    environment: lab
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to previously prepared Swarm
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export DOCKER_CONFIG="$RUNNER_TEMP/course-docker"
          mkdir -p "$DOCKER_CONFIG"
          trap 'docker logout ghcr.io' EXIT
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          owner=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          export REGISTRY="ghcr.io/$owner/course"
          export IMAGE_TAG="$GITHUB_SHA"
          docker stack deploy --with-registry-auth -c stack.yml course
          docker service scale course_keycloak=2
          docker stack services course
      - name: Wait for externally visible readiness
        run: |
          for attempt in $(seq 1 40); do
            if curl --fail --silent --cacert /opt/course-lab/tls.crt https://iam.lab.test/health/ready; then
              exit 0
            fi
            sleep 5
          done
          exit 1
