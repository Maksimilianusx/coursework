resolver 127.0.0.11 valid=5s ipv6=off;
resolver_timeout 3s;
upstream course_api {
    zone course_api 64k;
    server api:8000 resolve;
}
upstream course_identity {
    zone course_identity 64k;
    server keycloak:8080 resolve;
}

server {
    listen 80;
    server_name iam.lab.test;
    location = /_health { access_log off; return 200 'up'; }
    location / { return 301 https://iam.lab.test$request_uri; }
}
server {
    listen 443 ssl;
    server_name iam.lab.test;
    ssl_certificate /run/secrets/tls_cert;
    ssl_certificate_key /run/secrets/tls_key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 16k;
    root /usr/share/nginx/html;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    location /auth/ {
        proxy_pass http://course_identity;
        proxy_set_header Host iam.lab.test;
        proxy_set_header X-Forwarded-Host iam.lab.test;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_buffer_size 32k;
        proxy_buffers 4 32k;
    }
    location /api/ {
        proxy_pass http://course_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        add_header Cache-Control no-store always;
    }
    location = /health/ready { proxy_pass http://course_api; }
    location / {
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
        add_header Cache-Control no-store always;
        try_files $uri $uri/ =404;
    }
}
